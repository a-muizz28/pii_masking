[project]
name = "pii-masking"
version = "0.1.0"
description = "PII masking pipeline with encoder and LLM baselines."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=15.0",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "seqeval>=1.2.2",
    "scikit-learn>=1.5",
    "transformers>=4.45",
    "datasets>=2.20",
    "torch>=2.4",
    "matplotlib>=3.9",
    "llama-cpp-python>=0.3.38",
    "llama-models>=0.1.5",
    "llama-stack>=0.7.1",
    "llama-stack-client>=0.7.2",
    "accelerate>=0.34",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]