[project]
name = "pii-masking"
version = "0.1.0"
description = "PII masking pipeline with encoder and LLM baselines."
readme = "README.md"
requires-python = ">=3.10,<3.12"
dependencies = [
    "pandas>=2.0",
    "pyarrow>=15.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "seqeval>=1.2.2",
    "scikit-learn>=1.4",
    "transformers>=4.40",
    "datasets>=2.18",
    "torch>=2.2",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
